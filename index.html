<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sophia Lattermann – Portfolio</title>
<meta name="description" content="Sophia Lattermann, designer: UX/UI, graphic &amp; motion design, and game art.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0E1726;--surface:#152238;--surface-2:#1B2B45;--line:#26364F;--text:#EDF2F6;--muted:#93A4B6;--accent:#5CC2B8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:var(--bg);color:var(--text);font:400 16px/1.6 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
main{flex:1;width:100%;max-width:1120px;margin:0 auto;padding:clamp(64px,12vh,140px) clamp(16px,5vw,64px) 64px}
.kicker{font-size:13px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
h1{font-size:clamp(40px,7vw,84px);font-weight:700;letter-spacing:-.035em;line-height:1;margin:16px 0 20px}
.lead{font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:560px;margin-bottom:clamp(40px,7vh,72px)}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.card{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;text-decoration:none;color:inherit;transition:transform .25s,border-color .25s}
.card:hover,.card:focus-visible{transform:translateY(-4px);border-color:var(--accent);outline:none}
.thumb{aspect-ratio:4/3;overflow:hidden;background:var(--surface-2)}
.thumb img,.thumb video{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .5s}
.card:hover .thumb img,.card:hover .thumb video{transform:scale(1.04)}
.body{padding:22px 24px 26px;display:flex;flex-direction:column;gap:6px}
.body h2{font-size:24px;font-weight:600;letter-spacing:-.015em;display:flex;justify-content:space-between;align-items:center;gap:12px}
.body h2 span{color:var(--accent);transition:transform .25s}
.card:hover h2 span{transform:translateX(4px)}
.body p{color:var(--muted);font-size:15px}
footer{padding:32px clamp(16px,5vw,64px);color:var(--muted);font-size:14px;text-align:center}
@media (max-width:700px){.choices{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<main>
  <p class="kicker">Portfolio</p>
  <h1>Sophia Lattermann</h1>
  <p class="lead">Designer for interactive products and games.</p>

  <div class="choices">
    <a class="card" href="ux/">
      <div class="thumb"><video src="img/ux.mp4" poster="img/ux-poster.jpg" autoplay muted loop playsinline aria-label="Preview of the UX, graphic and motion design portfolio: member section client portal"></video></div>
      <div class="body"><h2>UX, Graphic &amp; Motion Design <span aria-hidden="true">→</span></h2><p>Product design, case studies, motion and vector illustrations.</p></div>
    </a>
    <a class="card" href="portfolio/">
      <div class="thumb"><img src="img/game.jpg" alt="Preview of the game art portfolio"></div>
      <div class="body"><h2>Game Art <span aria-hidden="true">→</span></h2><p>Digital art, hand-painted icons, pixel art and 3D.</p></div>
    </a>
  </div>
</main>
<footer>© 2026 Sophia Lattermann</footer>
</body>
</html>
